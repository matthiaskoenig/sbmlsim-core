[package]
name = "sbmlsim-python"
version.workspace = true
edition.workspace = true
# built by maturin into the python package `sbmlsim-core`, not published as a crate
publish = false
# the license of sbmlsim-host, whose engine.wasm (SUNDIALS, KLU and others, THIRD_PARTY.md) the
# extension embeds once it binds the host
license = "MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
authors.workspace = true
description = "The python bindings of sbmlsim-core"

[lib]
name = "sbmlsim_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py314"] }
pythonize = "0.30"
sbmlsim-abi = { path = "../abi" }
# the pool of the threads of a batch, with an engine instance per thread
sbmlsim-batch = { path = "../batch" }
# the fit of a model: the objective on the batch and the optimizers of basin (`fit/1`)
sbmlsim-fit = { path = "../fit" }
sbmlsim-compiler = { path = "../compiler" }
# The native engine: the integrator compiled for the machine of the wheel (CVODE and KLU built
# by `crates/csolvers`) with `model.wasm` and `mathlib.wasm` in wasmtime, which simulates about
# twice as fast as `engine.wasm` in wasmtime does (`bench/SBMLSIM.md`). Its results are not
# bitwise those of `engine.wasm`, see `crates/host/src/native.rs`.
sbmlsim-host = { path = "../host", features = ["native"] }
serde_path_to_error = "0.1.20"

# The allocator of the extension module (`src/lib.rs`, where the measurement is), on every
# target but macOS. It builds mimalloc's C sources through `cc`, which adds no requirement a
# build of this cdylib did not already have, since `crates/csolvers` compiles the C of the native
# engine anyway, and it travels inside the wheel: unlike an instruction set it depends on nothing
# about the machine which installs it, and no allocator can change a result.
#
# The target gate is the fix of #40 and the comment on `mod allocator` in `src/lib.rs` is why: on
# macOS mimalloc keeps the heap of a thread in two fixed slots of the pthread TLS block, claimed
# by compiled in number, so two extension modules which each link a copy of it corrupt each
# other's heaps. The macOS wheel therefore links none, and the gate is on the dependency and not
# only on the `#[global_allocator]`, so its C sources are not compiled there at all.
[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = "0.1"
