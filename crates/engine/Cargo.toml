[package]
name = "sbmlsim-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The engine of sbmlsim-core: integrates a compiled model with CVODE"

[features]
# the test models `Decay` and `Robertson` of `model.rs`, for the tests of this and other crates
test-models = []

[dependencies]
sbmlsim-abi = { path = "../abi" }
sbmlsim-csolvers = { path = "../csolvers" }
thiserror.workspace = true

[dev-dependencies]
# the integration tests use the test models
sbmlsim-engine = { path = ".", features = ["test-models"] }
