[package]
name = "sbmlsim-engine"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
license.workspace = true
authors.workspace = true
description = "The engine of sbmlsim-core: integrates a compiled model with SUNDIALS CVODE and IDA"

[features]
# the test models `Decay` and `Robertson` of `model.rs`, for the tests of this and other crates
test-models = []
# the exports of engine.wasm (`src/exports.rs`, wasm32 only); off in the wasm binaries of the
# tests, which would import the functions of a model
exports = ["dep:serde", "dep:serde_json"]

[dependencies]
sbmlsim-abi = { path = "../abi" }
sbmlsim-csolvers = { path = "../csolvers" }
# the generator which orders simultaneous events of equal priority, seeded by the request
rand_pcg = { version = "0.10", default-features = false }

# the JSON of the exports of engine.wasm (`src/exports.rs`)
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# the integration tests use the test models
sbmlsim-engine = { path = ".", features = ["test-models"] }

# the stepper's tests (`tests/stepper.rs`, native only): the native model of the C target, which
# they advance, and the WebAssembly model through the host, which they compare it with
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sbmlsim-c = { path = "../c" }
sbmlsim-compiler = { path = "../compiler" }
sbmlsim-host = { path = "../host" }
# the reader of SBML, with which the shared test data finds the species a reaction changes
sbmlsim-sbml = { path = "../sbml" }
serde_json.workspace = true
