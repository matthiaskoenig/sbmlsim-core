[package]
name = "sbmlsim-cli"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
# MIT code; it embeds engine.wasm (through sbmlsim-host), which statically links SUNDIALS
# (BSD-3-Clause) and KLU, BTF (LGPL-2.1-or-later), AMD, COLAMD and SuiteSparse_config
# (BSD-3-Clause), see THIRD_PARTY.md
license = "MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
authors.workspace = true
description = "The command line of sbmlsim-core"

[[bin]]
name = "sbmlsim-core"
path = "src/main.rs"

[features]
default = []
native = ["sbmlsim-host/native"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
sbmlsim-abi = { path = "../abi" }
sbmlsim-compiler = { path = "../compiler" }
sbmlsim-host = { path = "../host" }
rayon = "1.10"
serde.workspace = true
serde_json.workspace = true
# the models of a benchmark file in their order
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
wasmparser = "0.263"

[lib]
name = "sbmlsim_cli"
path = "src/lib.rs"
