[package]
name = "sbmlsim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The command line of sbmlsim-core"

[[bin]]
name = "sbmlsim-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
sbmlsim-abi = { path = "../abi" }
sbmlsim-compiler = { path = "../compiler" }
sbmlsim-host = { path = "../host" }
rayon = "1.10"
serde.workspace = true
serde_json.workspace = true

[lib]
name = "sbmlsim_cli"
path = "src/lib.rs"
