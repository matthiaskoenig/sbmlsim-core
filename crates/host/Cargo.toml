[package]
name = "sbmlsim-host"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
# MIT code; it embeds engine.wasm, which statically links SUNDIALS (BSD-3-Clause) and KLU, BTF
# (LGPL-2.1-or-later), AMD, COLAMD and SuiteSparse_config (BSD-3-Clause), see THIRD_PARTY.md
license = "MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
authors.workspace = true
description = "The wasmtime host of sbmlsim-core: links mathlib, a compiled model and the engine"

[features]
default = []
# The native engine for a caller which simulates with it, e.g. the python bindings: only the
# engine, so that a wheel carries no test model. The tests of this crate reach `Decay` and
# `Robertson` through the dev-dependency on the engine below, which enables `test-models` for
# a test build alone.
native = ["dep:sbmlsim-engine"]

[dependencies]
anyhow = "1"
sbmlsim-abi = { path = "../abi" }
# Optional adapter for benchmarking the engine compiled for the native machine
sbmlsim-engine = { path = "../engine", optional = true }
serde.workspace = true
serde_json.workspace = true
# the call hook counts the calls of the engine into the host (its WASI imports), wasmparser
# checks the sections of a model
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "cache", "call-hook", "demangle", "reexport-wasmparser"] }

[build-dependencies]
# the name of the custom section of `engine.wasm` and the version of its output
sbmlsim-abi = { path = "../abi" }

[dev-dependencies]
# compiled models, whose description is compared with what their module computes
sbmlsim-compiler = { path = "../compiler" }
# `Decay` and `Robertson` of `golden.rs` and `wat_model.rs`; a dev-dependency, so the feature
# `native` of a build which is not a test build carries no test model
sbmlsim-engine = { path = "../engine", features = ["test-models"] }
serde_json.workspace = true
tempfile = "3"
wat = "1"

[[test]]
name = "wat_model"
required-features = ["native"]

[[test]]
name = "compiled_model"
required-features = ["native"]

[[test]]
name = "golden"
required-features = ["native"]

[[test]]
name = "native"
required-features = ["native"]
