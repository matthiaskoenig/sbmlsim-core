[package]
name = "sbmlsim-host"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
# MIT code; it embeds engine.wasm, which statically links SUNDIALS (BSD-3-Clause) and KLU, BTF
# (LGPL-2.1-or-later), AMD, COLAMD and SuiteSparse_config (BSD-3-Clause), see THIRD_PARTY.md
license = "MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
authors.workspace = true
description = "The wasmtime host of sbmlsim-core: links mathlib, a compiled model and the engine"

[dependencies]
anyhow = "1"
sbmlsim-abi = { path = "../abi" }
# `EngineError`, which the host gives back as the native engine does
sbmlsim-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
# the call hook counts the calls of the engine into the host (its WASI imports), wasmparser
# checks the sections of a model
wasmtime = { version = "50.0.1", features = ["call-hook", "reexport-wasmparser"] }
wasmtime-wasi = "50.0.1"

[build-dependencies]
# the name of the custom section of `engine.wasm` and the version of its output
sbmlsim-abi = { path = "../abi" }

[dev-dependencies]
# compiled models, whose description is compared with what their module computes
sbmlsim-compiler = { path = "../compiler" }
# the native test model `Decay`, which the wasm chain is compared with
sbmlsim-engine = { path = "../engine", features = ["test-models"] }
serde_json.workspace = true
wat = "1"
