[package]
name = "sbmlsim-ode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Portable SBML equation analysis and source code generation"
publish = false

[features]
default = []
filesystem = []

[dependencies]
sbmlsim-document = { path = "../document" }
sbmlsim-reader = { path = "../reader" }
indexmap = { version = "2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
minijinja = { version = "3", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
regex = "1"
roxmltree = "0.21"

[lints]
