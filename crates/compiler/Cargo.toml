[package]
name = "sbmlsim-compiler"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
license.workspace = true
authors.workspace = true
description = "Compiles SBML to model.wasm and its description"

[dependencies]
sbmlsim-abi = { path = "../abi" }
sbmlsim-codegen = { path = "../codegen" }
sbmlsim-ir = { path = "../ir" }
sbmlsim-sbml = { path = "../sbml" }
serde.workspace = true

[dev-dependencies]
# the model units of sbmlsim, `testdata/model_units`
serde_json.workspace = true
# the units of a description read in a registry
sbmlsim-units = { path = "../units" }
