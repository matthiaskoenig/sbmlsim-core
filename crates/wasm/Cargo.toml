[package]
name = "sbmlsim-wasm"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
license.workspace = true
authors.workspace = true
description = "Compiles SBML to model.wasm and its description in a browser, compiler.wasm"

[lib]
name = "sbmlsim_wasm"
crate-type = ["cdylib", "rlib"]

[features]
# the PEtab v2 problems of `sbmlsim-petab` (`petab_open`, `petab_model`, `petab_requests`,
# `petab_evaluate` and `petab_close`), which `js/petab.mjs` drives: on by default, so the
# `compiler.wasm` of the npm package, of the python package and of the command line carries
# them (about 340 kB of 3.41 MB, 112 kB gzipped); `--no-default-features` is the compiler alone
default = ["petab", "fit"]
petab = ["dep:sbmlsim-petab"]
# the fit of a PEtab problem in a page (`petab_fit_open`, `petab_fit_ask`, `petab_fit_tell`,
# `petab_fit_stop` and `petab_fit_close`): the optimizers of `sbmlsim-fit` driven ask/tell by
# `js/petab.mjs`, on by default (408 kB on top of the 3.41 MB of the compiler with PEtab,
# 144 kB gzipped); `--no-default-features --features petab` evaluates a problem and fits none
fit = ["petab", "dep:sbmlsim-fit"]

[dependencies]
sbmlsim-ode = { path = "../ode" }
serde.workspace = true
sbmlsim-abi = { path = "../abi" }
sbmlsim-compiler = { path = "../compiler" }
serde_json.workspace = true
sbmlsim-petab = { path = "../petab", default-features = false, optional = true }
# the optimizers of a fit of a problem, driven ask/tell by the page (`petab_fit_*`)
sbmlsim-fit = { path = "../fit", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true
