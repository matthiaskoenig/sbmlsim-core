[package]
name = "sbmlsim-ir"
version.workspace = true
edition.workspace = true
# not on crates.io yet: the workspace builds from files outside the crate directories
# (THIRD_PARTY.md, third_party)
publish = false
license.workspace = true
authors.workspace = true

[dependencies]
sbmlsim-abi = { path = "../abi" }
sbmlsim-sbml = { path = "../sbml" }
# the math functions of a model, for the native evaluation (`eval`) and the constant folding
sbmlsim-mathlib = { path = "../mathlib" }
# the units pint has, which name a unit definition with a factor as sbmlsim does
sbmlsim-units = { path = "../units" }
# the powers of the units of libsbml, the same bits natively and in wasm
libm = "0.2"
thiserror.workspace = true
