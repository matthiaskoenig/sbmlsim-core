[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/mathlib",
    "crates/sbml",
    "crates/ir",
    "crates/codegen",
    "crates/compiler",
    "crates/csolvers",
    "crates/engine",
    "crates/host",
    "crates/batch",
    "crates/fit",
    "crates/cli",
    "crates/python",
    "crates/wasm",
]

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/sbmlsim-core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# every number of a request, a description or a result is read back as the double it was
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
roxmltree = "0.20"

# `compiler.wasm` of `crates/wasm`, the compiler in a browser: as small as the page which
# fetches it needs, since the module is downloaded before the first model is compiled
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
