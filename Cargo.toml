[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/document",
    "crates/reader",
    "crates/ode",
    "crates/mathlib",
    "crates/sbml",
    "crates/ir",
    "crates/codegen",
    "crates/compiler",
    "crates/csolvers",
    "crates/engine",
    "crates/c",
    "crates/host",
    "crates/batch",
    "crates/fit",
    "crates/petab",
    "crates/chaos",
    "crates/thin",
    "crates/sensitivity",
    "crates/cli",
    "crates/plot",
    "crates/plot-wasm",
    "crates/python",
    "crates/wasm",
    "crates/web-time",
]

[workspace.package]
version = "0.40.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/sbmlsim-core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# every number of a request, a description or a result is read back as the double it was
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
roxmltree = "0.20"

# `compiler.wasm` of `crates/wasm`, the compiler in a browser, and `plot.wasm` of
# `crates/plot-wasm`, the renderer of the figures: as small as the page which fetches them
# needs, since a module is downloaded before the first model is compiled or figure drawn
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the clock of basin is web-time, which is wasm-bindgen in wasm32-unknown-unknown: the time of
# the standard library under its name instead, see `crates/web-time`
[patch.crates-io]
web-time = { path = "crates/web-time" }
