[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/mathlib",
    "crates/sbml",
    "crates/ir",
    "crates/codegen",
    "crates/compiler",
    "crates/csolvers",
    "crates/engine",
    "crates/host",
    "crates/cli",
    "crates/python",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# every number of a request, a description or a result is read back as the double it was
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
roxmltree = "0.20"
