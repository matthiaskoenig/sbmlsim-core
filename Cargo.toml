[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/mathlib",
    "crates/sbml",
    "crates/ir",
    "crates/codegen",
    "crates/compiler",
    "crates/csolvers",
    "crates/engine",
    "crates/host",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
