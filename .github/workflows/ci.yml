# The checks of every pull request and of every push to develop. A newer push to a pull request
# cancels its running checks; a run of develop is never cancelled, since `publish` releases a tag
# from the wheels and the result of the run of develop on its commit. The rust caches are saved
# by the runs of develop only (`save-if`), which every pull request restores: the cache of the
# repository has a limit of 10 GB, and caches of pull requests evicted those of develop. Jobs
# which build the same profile share one cache (`shared-key`) which one of them saves.
name: ci
on:
  push:
    branches: [develop]
  pull_request:
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    # the format, the lint of every target and feature, and the crates of the engine, its solvers,
    # the sensitivity analysis and the statistics in wasm32-wasip1, which give the bits of their
    # native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
        with:
          wasmtime: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo fmt --check
      - run: cargo check -p sbmlsim-host -p sbmlsim-cli --no-default-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy -p sbmlsim-csolvers --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo clippy -p sbmlsim-engine --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo clippy -p sbmlsim-engine --lib --features exports --target wasm32-wasip1 -- -D warnings
      - run: cargo test -p sbmlsim-csolvers --target wasm32-wasip1
      - run: cargo test -p sbmlsim-engine --target wasm32-wasip1
      # the global sensitivity analysis gives the bits of its native tests in wasm
      - run: cargo clippy -p sbmlsim-sensitivity --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo test -p sbmlsim-sensitivity --target wasm32-wasip1
      # the statistics (every module, the random streams and the sizes of a usize of 32 bits)
      # give the bits of their native tests in wasm
      - run: cargo clippy -p sbmlsim-stats --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo test -p sbmlsim-stats --target wasm32-wasip1
  test:
    # the tests of the workspace with every feature, the command line and the math library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      # the cache of the dev profile, which testsuite-cases and python-bindings restore
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # the cases of PEtab v2 and of its math of the PEtab test suite, which the test of
      # crates/petab runs against its baseline (it skips without them)
      - run: python3 scripts/petab_testsuite.py download
      # the problems of the PEtab benchmark collection, downloaded and converted to PEtab v2 by
      # sbmlsim, which the test of crates/petab runs against its baseline (it skips without them)
      - uses: astral-sh/setup-uv@v5
      - name: Cache the PEtab benchmark collection
        id: petab-benchmark
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbmlsim/petab-benchmark
          key: petab-benchmark-${{ hashFiles('scripts/petab_benchmark.py') }}
      - name: Download the PEtab benchmark collection
        if: steps.petab-benchmark.outputs.cache-hit != 'true'
        run: uv run scripts/petab_benchmark.py download
      # the tests of sbmlsim-host and sbmlsim-cli build engine.wasm and mathlib.wasm (WASI_SDK_PATH)
      - run: cargo test --all-features
      - run: cargo run -p sbmlsim-cli -- simulate crates/host/tests/decay-model crates/host/tests/decay-model/request.json
      - run: cargo build -p sbmlsim-mathlib --target wasm32-unknown-unknown --release
      - run: cargo test -p sbmlsim-mathlib wasm_has_no_imports
  compiler_builds_for_wasm32_unknown_unknown:
    # the compiler (and the crates it is made of) does no file system or OS access, so it runs
    # in a browser as wasm32-unknown-unknown; needs no wasi-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo build -p sbmlsim-abi --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-sbml --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-ir --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-codegen --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-ode --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-compiler --target wasm32-unknown-unknown --release
      - run: cargo build -p sbmlsim-sensitivity --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-stats --target wasm32-unknown-unknown
      # PEtab v2 read, planned and evaluated without an engine, as a page runs it
      - run: cargo build -p sbmlsim-petab --no-default-features --target wasm32-unknown-unknown
      # the planner of a scan, whose requests a page drives ask/tell, its units and the rules of
      # its timecourses
      - run: cargo clippy -p sbmlsim-units --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p sbmlsim-timecourse --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p sbmlsim-scan --target wasm32-unknown-unknown -- -D warnings
      # the fit without the batch, whose optimizers a page drives ask/tell
      - run: cargo clippy -p sbmlsim-fit --no-default-features --target wasm32-unknown-unknown -- -D warnings
      # `compiler.wasm`, the compiler of `js/compile.mjs` with PEtab of `js/petab.mjs` and its
      # fit (the default features petab and fit): the module of the npm package
      - run: cargo build -p sbmlsim-wasm --target wasm32-unknown-unknown --profile wasm
      - run: cargo clippy -p sbmlsim-wasm --target wasm32-unknown-unknown -- -D warnings
      # PEtab without the fit, and the compiler alone
      - run: cargo build -p sbmlsim-wasm --no-default-features --features petab --target wasm32-unknown-unknown --profile wasm
      - run: cargo build -p sbmlsim-wasm --no-default-features --target wasm32-unknown-unknown --profile wasm
      - run: cargo test -p sbmlsim-wasm
      - run: cargo test -p sbmlsim-wasm --no-default-features --features petab
      - run: cargo test -p sbmlsim-wasm --no-default-features
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The import-free source generator matches native export fixtures
        run: node --test js/test/ode.test.mjs
        env:
          SBMLSIM_ODE_WASM: target/wasm32-unknown-unknown/wasm/sbmlsim_wasm.wasm
  plot_wasm_same_bytes:
    # `plot.wasm`, the renderer of the figures in a page: built for wasm32-wasip1 (its crate says
    # why), it must give in Node the golden SVG of every fixture of sbmlsim-plot byte for byte,
    # the bytes the native renderer gives; needs no wasi-sdk (no C)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo clippy -p sbmlsim-plot-wasm --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo build -p sbmlsim-plot-wasm --target wasm32-wasip1 --profile wasm
      - run: cargo test -p sbmlsim-plot-wasm
      - name: plot.wasm in Node gives the golden SVG of every fixture
        run: node crates/plot-wasm/check_golden.mjs target/wasm32-wasip1/wasm/sbmlsim_plot_wasm.wasm
  same_bits_as_wasmtime:
    # the JavaScript loader in Node: its tests, and every passing case of the SBML Test Suite
    # gives in Node the CSV of the wasmtime host byte for byte (js/test/same_bits.test.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the tests over the prepared cases fail without them instead of skipping
      SBMLSIM_CORE_REQUIRE_CASES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          # the cache of the release build of the command line, which testsuite-parity,
          # testsuite-c-target and the job runtime of the wheels restore
          shared-key: release-cli
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache the prepared cases
        uses: actions/cache@v4
        with:
          path: testdata/cases
          key: testsuite-cases-${{ hashFiles('scripts/prepare_testsuite.py', 'testdata/testsuite_baseline.json') }}
      - name: Prepare the cases
        run: test -f testdata/cases/SUITE_COMMIT || uv run scripts/prepare_testsuite.py --out testdata/cases
      - name: The prepared cases are present
        run: test -f testdata/cases/00001/case.json
      # with the feature native for its command petab, which js/test/petab.test.mjs compares with
      - run: cargo build --release -p sbmlsim-cli --features native
      # the cases of the PEtab test suite, which js/test/petab.test.mjs runs in the JavaScript host
      - run: python3 scripts/petab_testsuite.py download
      - name: Export every passing case with the outputs of the wasmtime host (the parity is the job testsuite-parity)
        run: target/release/sbmlsim-core testsuite testdata/cases --export "$RUNNER_TEMP/export"
      - name: The build tools of the JavaScript host (esbuild of the inline build)
        run: npm ci --prefix js --no-audit --no-fund
      - name: The tests of the loader in Node
        # inline.test.mjs checks that the committed inline build is the one of the sources
        run: node --test js/test
        env:
          SBMLSIM_CORE_CLI: ${{ github.workspace }}/target/release/sbmlsim-core
          SBMLSIM_CORE_EXPORT: ${{ runner.temp }}/export
      - name: The npm package packs (its runtime, its license and one version everywhere)
        run: |
          target/release/sbmlsim-core runtime -o js/runtime
          cd js && npm pack --dry-run
  testsuite-parity:
    # the whole SBML Test Suite against the baseline (testdata/testsuite_baseline.json), with the
    # repeat checks, in the three modes of the Jacobian and the optimizer: a case which passes or
    # fails otherwise than the baseline says fails the job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SBMLSIM_CORE_REQUIRE_CASES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cli
          save-if: false
      - uses: astral-sh/setup-uv@v5
      - name: Cache the prepared cases
        uses: actions/cache@v4
        with:
          path: testdata/cases
          key: testsuite-cases-${{ hashFiles('scripts/prepare_testsuite.py', 'testdata/testsuite_baseline.json') }}
      - name: Prepare the cases
        run: test -f testdata/cases/SUITE_COMMIT || uv run scripts/prepare_testsuite.py --out testdata/cases
      - name: The prepared cases are present
        run: test -f testdata/cases/00001/case.json
      - run: cargo build --release -p sbmlsim-cli
      - name: testsuite parity (analytic Jacobian)
        run: target/release/sbmlsim-core testsuite testdata/cases
      - name: testsuite parity (difference Jacobian)
        run: target/release/sbmlsim-core testsuite testdata/cases --jacobian difference
      - name: testsuite parity (without the optimizer)
        run: target/release/sbmlsim-core testsuite testdata/cases --no-optimize
      - name: testsuite parity (the composed models of comp, flattened by the reader of the core)
        run: target/release/sbmlsim-core testsuite testdata/cases --comp
  testsuite-c-target:
    # the whole SBML Test Suite on the native engine with the model code of the C target, against
    # the baseline of model.wasm: every case of it passes but those the C target refuses (the
    # delays), which must be the refusals pinned in testdata/testsuite_refused_c.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SBMLSIM_CORE_REQUIRE_CASES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cli
          save-if: false
      - uses: astral-sh/setup-uv@v5
      - name: Cache the prepared cases
        uses: actions/cache@v4
        with:
          path: testdata/cases
          key: testsuite-cases-${{ hashFiles('scripts/prepare_testsuite.py', 'testdata/testsuite_baseline.json') }}
      - name: Prepare the cases
        run: test -f testdata/cases/SUITE_COMMIT || uv run scripts/prepare_testsuite.py --out testdata/cases
      - name: The prepared cases are present
        run: test -f testdata/cases/00001/case.json
      - run: cargo build --release -p sbmlsim-cli --features native
      - name: testsuite with the model code of the C target
        run: target/release/sbmlsim-core testsuite testdata/cases --model-code c
        env:
          SBMLSIM_C_CACHE: ${{ runner.temp }}/sbmlsim-c
      - name: testsuite with the model code of the C target (the composed models of comp)
        run: target/release/sbmlsim-core testsuite testdata/cases --model-code c --comp
        env:
          SBMLSIM_C_CACHE: ${{ runner.temp }}/sbmlsim-c
  testsuite-cases:
    # the prepared cases of the SBML Test Suite and the tests of the runner which read them
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SBMLSIM_CORE_REQUIRE_CASES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: false
      - uses: astral-sh/setup-uv@v5
      - name: Cache the prepared cases
        # the script refuses a suite commit other than the baseline's, so the baseline keys the cases
        uses: actions/cache@v4
        with:
          path: testdata/cases
          key: testsuite-cases-${{ hashFiles('scripts/prepare_testsuite.py', 'testdata/testsuite_baseline.json') }}
      - name: Prepare the cases
        run: test -f testdata/cases/SUITE_COMMIT || uv run scripts/prepare_testsuite.py --out testdata/cases
      - name: The prepared cases are present
        run: test -f testdata/cases/00001/case.json
      # the tests of the runner (of both model codes), of the reader, the IR and the compiler,
      # and of the C target over the cases
      - run: cargo test -p sbmlsim-cli -p sbmlsim-sbml -p sbmlsim-ir -p sbmlsim-c --features sbmlsim-cli/native
  python-bindings:
    # the python package sbmlsim_core (crates/python, built with maturin): the lint, the tests and
    # the type check of its stub on an editable install; the wheels of every platform are built
    # and tested as users get them by the job `wheels`
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/wasi-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: false
      - uses: astral-sh/setup-uv@v5
      - name: Editable install
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Lint and format of the python of the repository, markdown blocks included
        run: |
          .venv/bin/ruff check
          .venv/bin/ruff format --check
      - name: The assets of the live demo of the documentation
        run: .venv/bin/python scripts/demo_assets.py --check
      - name: The tests
        run: .venv/bin/pytest python/tests -q
      - name: Run the generated NumPy and JAX simulators against their migration oracles
        run: |
          uv pip install --python .venv --group ode-tests
          .venv/bin/pytest python/tests/test_ode_exports.py -q
      - name: The global sensitivity analysis against SALib
        run: |
          uv pip install --python .venv --group sensitivity-tests
          .venv/bin/pytest python/tests/test_sensitivity_salib.py -q
      - name: The type check of the stub, of a caller (python/typecheck) and of the tests
        # the stub is hand written: the drift test compares names only, this holds the signatures;
        # the tests import SALib, so the check runs after the group sensitivity-tests is installed
        run: .venv/bin/ty check python/typecheck python/tests
  wheels:
    # the wheels which `publish` publishes, built and tested on every platform
    uses: ./.github/workflows/wheels.yml
