name: ci
on:
  push:
    branches: [develop]
  pull_request:
env:
  WASI_SDK_VERSION: "34.0"
  WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
  WASMTIME_VERSION: "50.0.1"
  WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install wasi-sdk and wasmtime
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          sdk="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          curl -sSLO "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/${sdk}.tar.gz"
          echo "${WASI_SDK_SHA256}  ${sdk}.tar.gz" | sha256sum -c -
          tar xzf "${sdk}.tar.gz"
          echo "WASI_SDK_PATH=$HOME/tools/${sdk}" >> "$GITHUB_ENV"
          wasmtime="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          curl -sSLO "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${wasmtime}.tar.xz"
          echo "${WASMTIME_SHA256}  ${wasmtime}.tar.xz" | sha256sum -c -
          tar xJf "${wasmtime}.tar.xz"
          echo "$HOME/tools/${wasmtime}" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p sbmlsim-csolvers --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo clippy -p sbmlsim-engine --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo clippy -p sbmlsim-engine --lib --features exports --target wasm32-wasip1 -- -D warnings
      # the tests of sbmlsim-host and sbmlsim-cli build engine.wasm and mathlib.wasm (WASI_SDK_PATH)
      - run: cargo test
      - run: cargo run -p sbmlsim-cli -- simulate crates/host/tests/decay-model crates/host/tests/decay-model/request.json
      - run: cargo build -p sbmlsim-abi --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-sbml --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-ir --target wasm32-unknown-unknown
      - run: cargo build -p sbmlsim-mathlib --target wasm32-unknown-unknown --release
      - run: cargo test -p sbmlsim-mathlib wasm_has_no_imports
      - run: cargo test -p sbmlsim-csolvers --target wasm32-wasip1
      - run: cargo test -p sbmlsim-engine --target wasm32-wasip1
