# Publish the JavaScript host (`js/`, the npm package `sbmlsim-core`) for a tag `vX.Y.Z` on a
# commit of develop: the engine and its math library are built from the tagged sources into
# `js/runtime`, the tests of the host run against them, and npm publishes with trusted
# publishing (the OIDC token of GitHub, no stored token) and the provenance of this workflow.
# A version npm has already (the first release was published by hand to create the package) is
# not published again.
name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  WASI_SDK_VERSION: "34.0"
  WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance of npm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Check the version of the tag
        run: |
          version="$(node -p "require('./js/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not the version ${version} of js/package.json"
            exit 1
          fi
          test -f "release-notes/${version}.md" || { echo "release-notes/${version}.md is missing"; exit 1; }
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install wasi-sdk
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          sdk="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          curl -sSLO "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/${sdk}.tar.gz"
          echo "${WASI_SDK_SHA256}  ${sdk}.tar.gz" | sha256sum -c -
          tar xzf "${sdk}.tar.gz"
          echo "WASI_SDK_PATH=$HOME/tools/${sdk}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check that npm publishes with trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} has no trusted publishing, 11.5.1 or newer has`); process.exit(1); }
          ' "$(npm --version)"
      - name: Build the command line, the engine and its math library
        run: |
          cargo build --release -p sbmlsim-cli
          target/release/sbmlsim-core runtime -o js/runtime
      - name: The tests of the JavaScript host
        run: node --test js/test
        env:
          SBMLSIM_CORE_CLI: ${{ github.workspace }}/target/release/sbmlsim-core
      - name: Publish
        working-directory: js
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "sbmlsim-core@${version}" version >/dev/null 2>&1; then
            echo "::notice::sbmlsim-core ${version} is on npm already, nothing is published"
            exit 0
          fi
          npm publish --provenance --access public
